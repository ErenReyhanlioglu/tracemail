[project]
name = "tracemail-pipeline"
version = "0.0.0"
description = "Ingest, parse, and load job-application mail."
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-cloud-storage>=3.16.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
