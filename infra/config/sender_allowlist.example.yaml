# Sender allowlist: only mail from senders matched here enters the system.
# Default: reject.
#
# Copy to sender_allowlist.yaml (not committed) and point
# TRACEMAIL_SENDER_ALLOWLIST_PATH at it.

# Exact address match.
exact:
  - jobalerts-noreply@linkedin.com # job alerts
  - jobs-noreply@linkedin.com # application confirmations

# Domain match: the domain itself and its subdomains.
domains:
  - candidates.workablemail.com # Workable
  - hire.lever.co # Lever
  - example-company.com
