# dbt project (ADR-0014). One BigQuery dataset per layer (CLAUDE.md, BigQuery
# and dbt); dataset names are used as written, without a target prefix
# (macros/generate_schema_name.sql), because dev and prod are separate GCP
# projects (ADR-0010).
name: tracemail
version: "0.1.0"
config-version: 2
profile: tracemail
require-dbt-version: [">=1.12.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
clean-targets: ["target", "dbt_packages"]

flags:
  # No usage telemetry to dbt Labs.
  send_anonymous_usage_stats: false

# Every BigQuery job carries its dbt node as job labels, so the billed bytes
# of each model and test can be read from job metadata (ADR-0023).
query-comment:
  job-label: true

vars:
  # Days without any event after which an open application shows "no reply
  # for N days" (ADR-0024).
  silence_days: 10
  # Days without any event after which an open application counts as closed
  # without reply and stops suggesting a follow-up (ADR-0027).
  closed_after_days: 30
  # The owner's local date decides "today" for read-time ages; storage is UTC.
  display_timezone: "Europe/Istanbul"
  # Canonical posting URL, rebuilt from the job id (mail links carry tokens).
  linkedin_job_url_prefix: "https://www.linkedin.com/jobs/view/"
  # Incremental event loads recompute applications with mail in the last N
  # loaded days, matching the ingestion window (ADR-0007).
  event_lookback_days: 3
  # Weekly volume anomaly (ADR-0020): a complete week below this share of the
  # trailing weeks' mean is flagged.
  volume_trailing_weeks: 4
  volume_drop_ratio: 0.5
  # Job name of dbt builds in ops.pipeline_runs (set by record-dbt-build).
  dbt_build_job: "dbt_build"
  # First hour the scheduled DAG covered (step 1.7); hours before it are not
  # expected, so they are never counted as missed.
  hourly_schedule_start: "2026-10-09 20:00:00+00"
  # Monthly free tiers, per billing account (checked 2026-10-10):
  # https://docs.cloud.google.com/free/docs/free-cloud-features and
  # https://cloud.google.com/bigquery/pricing (1 TiB of query bytes).
  free_tier_gcs_class_a: 5000
  free_tier_gcs_class_b: 50000
  free_tier_bigquery_query_bytes: 1099511627776
  # Projected use above this share of a free tier makes optimization
  # mandatory (CLAUDE.md, 85% rule).
  free_tier_action_share: 0.85
  # The month-end projection carries the rate of this many recent hours over
  # the rest of the month.
  projection_lookback_hours: 24

models:
  tracemail:
    # Views cost nothing to create (ADR-0022); staging only renames and casts.
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table
      # Health summaries are small and read through the API's cache; views
      # cost nothing to build (ADR-0022) and are always current.
      health:
        +materialized: view

seeds:
  tracemail:
    +schema: staging
