seeds:
  - name: event_type_statuses
    description: >
      Owner-approved mapping from application event type to the status it
      sets (ADR-0024). An empty status means the event does not change the
      status. Precedence breaks ties between events on the same day: a
      rejection outranks progress, progress outranks the application itself.
      Phase 2's reply classifier outputs these event types.
    config:
      column_types:
        event_type: string
        sets_status: string
        status_precedence: int64
        description: string
    columns:
      - name: event_type
        data_tests: [unique, not_null]
      - name: sets_status
        data_tests:
          - accepted_values:
              arguments:
                values: [applied, in_progress, rejected]

  - name: deployment_failures
    description: >
      Production deployments that needed immediate intervention (ADR-0045,
      ADR-0046), one row each, added in the pull request that fixes or
      follows up on them (CLAUDE.md, Incidents): the failing deployment's
      commit, when the failure was detected, when service was restored if
      that was not a deployment, the pull request whose deployment fixed it
      if one did, and the incident report.
    config:
      column_types:
        failed_sha: string
        detected_at: timestamp
        recovered_at: timestamp
        fixed_pull_request: int64
        incident_report: string
    data_tests:
      # Recovery is either a time or a fixing deployment, never neither.
      - dbt_utils.expression_is_true:
          arguments:
            expression: "recovered_at is not null or fixed_pull_request is not null"
    columns:
      - name: failed_sha
        data_tests: [unique, not_null]
      - name: detected_at
        data_tests: [not_null]
      - name: incident_report
        data_tests: [not_null]
