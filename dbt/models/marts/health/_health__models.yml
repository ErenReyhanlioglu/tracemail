models:
  - name: fct_pipeline_runs
    description: Run history, one row per pipeline step execution; no error messages.
    columns:
      - name: run_id
        data_tests: [unique, not_null]

  - name: fct_job_freshness
    description: Last run, its status, and hours since the last success, per step.
    columns:
      - name: job_name
        data_tests: [unique, not_null]

  - name: fct_mail_freshness
    description: Newest stored message's received date and age in days (one row).
    columns:
      - name: newest_received_date
        data_tests: [not_null]

  - name: fct_parse_quality_weekly
    description: Messages parsed, failed, and unclaimed per week and parse group.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [week_start, parse_group]

  - name: fct_mail_volume_weekly
    description: Messages per complete week against the trailing weeks' mean.
    columns:
      - name: week_start
        data_tests: [unique, not_null]

  - name: fct_hourly_runs
    description: >
      One row per hour the hourly DAG should have covered; missed hours have
      no ingestion run record (ADR-0020).
    columns:
      - name: hour_start
        data_tests: [unique, not_null]

  - name: fct_free_tier_usage
    description: >
      Current month's free-tier use per allowance from run records,
      projected to month end; GCS storage counts everything stored, not the
      month's use. Flags allowances over the 85% rule (CLAUDE.md).
    columns:
      - name: allowance
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values:
                  - gcs_class_a
                  - gcs_class_b
                  - gcs_storage_bytes
                  - bigquery_query_bytes

  - name: fct_dbt_builds
    description: One row per recorded dbt build with tests, cost, and coverage.
    columns:
      - name: run_id
        data_tests: [unique, not_null]

  - name: fct_hourly_stages
    description: >
      Each pipeline stage's outcome per expected hourly interval: ok, late,
      failed, skipped (nothing new to process), missed, or pending (no record
      yet, before the hour's deadline) (ADR-0044).
    columns:
      - name: stage_hour_key
        data_tests: [unique, not_null]
      - name: stage_state
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ok, late, failed, skipped, missed, pending]

  - name: fct_hourly_freshness
    description: >
      The end-to-end freshness SLO per hourly interval: on time when every
      stage finished within the target; null while a stage is pending
      (ADR-0044).
    columns:
      - name: hour_start
        data_tests: [unique, not_null]

  - name: fct_bigquery_storage
    description: Current BigQuery storage in logical bytes against its free tier (one row).
    columns:
      - name: allowance
        data_tests: [unique, not_null]

  - name: fct_deployments
    description: >
      One row per commit sent to production, with its first successful
      deployment, failed attempts, lead time, and whether it was a change
      failure or a fix (ADR-0045).
    columns:
      - name: commit_sha
        data_tests: [unique, not_null]
