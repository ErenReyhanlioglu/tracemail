[project]
name = "tracemail-api"
version = "0.0.0"
description = "HTTP API for the web app and the capture button."
requires-python = ">=3.12,<3.13"
dependencies = [
    "authlib>=1.8.0",
    "fastapi>=0.143.0",
    "httpx2>=2.13.1",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12"]
build-backend = "uv_build"
