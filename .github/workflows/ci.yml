name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Typecheck
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Shell lint
        run: shellcheck infra/vm/*.sh infra/gcp/*.sh
      # The VM's deploy user restrictions (ADR-0035): login shell gate,
      # sudoers syntax, deploy script argument check.
      - name: Deploy access test
        run: bash infra/vm/test-deploy-gate.sh

  web:
    name: Web lint, typecheck, build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    env:
      # Build-time value only; the build makes no request to it.
      TRACEMAIL_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  # dbt build and data tests on the dev project's data, into ci_* datasets
  # (ADR-0037). GitHub's OIDC token is exchanged through Workload Identity
  # Federation for the CI service account; no key is stored. Pull requests
  # from forks get no OIDC token, so the job runs only for this repository's
  # own branches. Runs one at a time: they share the ci_* datasets.
  dbt:
    name: dbt build (CI target)
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    concurrency:
      group: dbt-ci
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TRACEMAIL_GCP_PROJECT: ${{ vars.GCP_DEV_PROJECT }}
      TRACEMAIL_BQ_LOCATION: us-central1
      TRACEMAIL_BQ_LANDING_DATASET: landing
      TRACEMAIL_BQ_OPS_DATASET: ops
      TRACEMAIL_BQ_MAX_BYTES_BILLED: "1073741824"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SERVICE_ACCOUNT }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dbt
        run: uv sync --project dbt --locked
      - name: Install dbt packages
        run: uv run --project dbt dbt deps --project-dir dbt --profiles-dir dbt
      # A full refresh, so the result never depends on an earlier CI run.
      - name: dbt build
        run: uv run --project dbt dbt build --project-dir dbt --profiles-dir dbt --target ci --full-refresh

  # The three images for the arm64 VM (ADR-0012), built natively on an arm64
  # runner after every check passes. Pull requests only build them, so a
  # Dockerfile that breaks on arm64 never reaches main; a push to main also
  # publishes them to GHCR, tagged with the commit SHA.
  images:
    name: Image (${{ matrix.image }})
    needs: [check, web, dbt]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: airflow
            context: .
            dockerfile: apps/airflow/Dockerfile
          - image: api
            context: .
            dockerfile: apps/api/Dockerfile
          - image: web
            context: apps/web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The build needs no git credentials; none are left on disk.
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR image names must be lowercase; the owner name may not be.
      - name: Image name
        env:
          IMAGE: ${{ matrix.image }}
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tracemail-${IMAGE}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

  # Deploys main to the VM (ADR-0012, ADR-0035). The job joins the tailnet as
  # tag:ci through workload identity federation: Tailscale trusts GitHub's
  # OIDC token for this repository's production environment, so no
  # credential is stored anywhere. Deploys run one at a time; re-running an
  # earlier run's deploy job rolls back to that commit.
  deploy:
    name: Deploy
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      VM_HOST: tracemail-prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ env.VM_HOST }}
      - name: Check access and deploy
        run: bash infra/vm/ci-deploy.sh "$VM_HOST" "$GITHUB_SHA"
